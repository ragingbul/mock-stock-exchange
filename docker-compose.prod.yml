# TRADEVERSE — Oracle Always Free production stack
# Public access only through nginx (ports 80/443).
# Run migrations via scripts/oci/deploy.sh — not on every backend restart.

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mock_stock_exchange}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mse} -d ${POSTGRES_DB:-mock_stock_exchange}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tradeverse

  backend:
    build: ./backend
    container_name: tradeverse-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mock_stock_exchange}
      ENVIRONMENT: production
      DEBUG: "false"
      AUTO_INIT_DB: "false"
      SIMULATION_SPEED: ${SIMULATION_SPEED:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env}
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    networks:
      - tradeverse

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?Set NEXT_PUBLIC_WS_URL in .env}
        NEXT_PUBLIC_API_PREFIX: ${NEXT_PUBLIC_API_PREFIX:-/api/v1}
    container_name: tradeverse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - tradeverse

  nginx:
    image: nginx:1.27-alpine
    container_name: tradeverse-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - tradeverse

volumes:
  postgres_data:

networks:
  tradeverse:
    driver: bridge
