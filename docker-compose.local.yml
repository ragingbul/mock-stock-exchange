# TRADEVERSE — local LAN server (laptop hosts the event)
# HTTP only on port 80 via nginx. No TLS. Oracle prod stack unchanged.
# Start: scripts/local/start.ps1  or  scripts/local/start.sh

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeverse-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mock_stock_exchange}
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mse} -d ${POSTGRES_DB:-mock_stock_exchange}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tradeverse_local

  backend:
    build: ./backend
    container_name: tradeverse-local-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mock_stock_exchange}
      ENVIRONMENT: production
      DEBUG: "false"
      AUTO_INIT_DB: "false"
      SIMULATION_SPEED: ${SIMULATION_SPEED:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      BACKEND_URL: ${BACKEND_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    networks:
      - tradeverse_local

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_API_PREFIX: ${NEXT_PUBLIC_API_PREFIX:-/api/v1}
    container_name: tradeverse-local-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - tradeverse_local

  nginx:
    image: nginx:1.27-alpine
    container_name: tradeverse-local-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/tradeverse.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - tradeverse_local

volumes:
  postgres_data_local:

networks:
  tradeverse_local:
    driver: bridge
